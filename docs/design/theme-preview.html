/* ── STEPS: diamond chain ────────────────────────────────────────────────── */
body.theme-rug .content-section:has(.process-step){display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px;overflow:visible;position:relative;counter-reset:step}
body.theme-rug .content-section:has(.process-step)>h2,body.theme-rug .content-section:has(.process-step)>p{grid-column:1/-1}
body.theme-rug .content-section:has(.process-step)>.process-step{display:block;width:auto;padding:100px 10px 0;text-align:center;border:0;position:relative}
body.theme-rug .process-step::before{all:unset;content:"";position:absolute;top:8px;left:50%;width:50px;height:50px;transform:translateX(-50%) rotate(45deg);display:block;box-sizing:border-box;
    background:linear-gradient(135deg,var(--teal),#b02a50);border:3px solid #e3ad32;box-shadow:0 0 0 5px var(--surface),0 0 0 7px var(--orange);z-index:2}
body.theme-rug .process-step::after{all:unset;content:counter(step);position:absolute;top:8px;left:50%;width:50px;height:50px;margin-left:-25px;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:#fff;z-index:3}
body.theme-rug .process-step h3::before{content:"";position:absolute;top:36px;left:calc(50% + 52px);width:calc(100% - 104px + 14px);height:6px;
    background:linear-gradient(45deg,#c9a45a 25%,transparent 25%) 0 0/12px 6px,linear-gradient(-45deg,#c9a45a 25%,transparent 25%) 0 0/12px 6px}
body.theme-rug .process-step:last-child h3::before{display:none}
body.theme-rug .process-step h3{font-weight:700}
@media (max-width:899px){body.theme-rug .content-section:has(.process-step){grid-template-columns:1fr 1fr;row-gap:36px}body.theme-rug .process-step h3::before{display:none}}
@media (max-width:520px){body.theme-rug .content-section:has(.process-step){grid-template-columns:1fr}}


body.theme-rug .brands-list{text-align:center}
body.theme-rug .brands-chip{border-radius:2px;background:var(--surface-2);border:2px double #d9bd8c;font-family:var(--font-head);font-weight:700}
body.theme-rug .brands-chip::before{border-radius:0;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,var(--teal),var(--orange));-webkit-mask:none;mask:none}

/* ── FAQ: narrow centred, roman numerals ─────────────────────────────────── */
body.theme-rug .faq-accordion{max-width:780px;margin:0 auto;counter-reset:q}
body.theme-rug .faq-acc-item{border-radius:0;border:2px solid #d9bd8c;outline:1px solid rgba(138,31,61,.25);outline-offset:-6px;background:var(--surface-2);counter-increment:q}
body.theme-rug .faq-acc-item__q-text::before{content:counter(q,upper-roman) ".  ";font-family:var(--font-head);color:var(--orange);font-weight:700}

/* ── LINKS: portrait swatches with fringe ────────────────────────────────── */

body.theme-rug .links-tile::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-14px;height:14px;background:repeating-linear-gradient(90deg,#d9a52b 0 2px,transparent 2px 6px)}

body.theme-rug .links-tile__text{font-family:var(--font-head);font-weight:700;font-size:1rem}

body.theme-rug .logo-mark{position:absolute;inset:0;background:linear-gradient(180deg,#f6d98a,#d9a52b);
    -webkit-mask:url("../logo-mono-192.png") center/contain no-repeat;mask:url("../logo-mono-192.png") center/contain no-repeat}
@media (min-width:480px){body.theme-rug .logo-wrap{width:52px;height:52px}}
/* ═══════════════════════════════════════════════════════════════════════════
   THEME: flame — gas stoves & cooktops.  LAYOUT CONCEPT: "kitchen line".
   · hero  = full-bleed dark; a stove top with four glowing burners on the right
   · cards = restaurant MENU BOARD: two columns, title ........ leader dots
   · steps = HEAT LEVELS: giant outlined numerals + a heat bar that fills per step
   · FAQ   = two-column grid of dark tiles with ember numbers
   · links = long horizontal bar rows
   Needs hero partial variant: hero-stove (adds .hero__art with <svg>).
   ═══════════════════════════════════════════════════════════════════════════ */
body.theme-flame {
    color-scheme: dark;
    --ink:#f6efe8; --ink-soft:#d8cdc2; --muted:#a99d90;
    --surface:#110e0c; --surface-2:#1c1815; --border:#3a312a; --border-soft:#2a231e;
    --teal:#ff8a3d; --teal-dark:#1a0f08; --teal-light:rgba(255,138,61,.13); --teal-glow:rgba(255,138,61,.25);
    --orange:#d63a14; --orange-dark:#b52c0b; --orange-light:rgba(214,58,20,.14); --orange-glow:rgba(214,58,20,.35);
    --font-head:"Oswald","Inter",Arial,sans-serif;
    --font-body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-family:var(--font-body); background:var(--surface);
}
html:has(body.theme-flame){background:#110e0c}
body.theme-flame::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 420px at 50% 110%,rgba(214,58,20,.18),transparent 65%),radial-gradient(600px 400px at 0 0,rgba(255,138,61,.07),transparent 60%)}
body.theme-flame .hero__title,body.theme-flame .content-section h2,body.theme-flame .links-section__title,
body.theme-flame .faq-section__title,body.theme-flame .info-card h3,body.theme-flame .process-step h3{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.04em}
body.theme-flame .content-section h2,body.theme-flame .links-section__title,body.theme-flame .faq-section__title{font-weight:600;font-size:clamp(1.4rem,3.2vw,2rem)}
body.theme-flame .content-section h2{border-bottom:1px solid var(--border)}
body.theme-flame .content-section h2::after{width:80px;height:3px;bottom:-2px;border-radius:0;background:linear-gradient(90deg,var(--orange),var(--teal));box-shadow:0 0 14px var(--orange-glow)}
body.theme-flame .content-section a{color:var(--teal)}

body.theme-flame header{background:#0b0908;border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(255,138,61,.35),0 8px 30px rgba(0,0,0,.5)}
body.theme-flame header::after{display:none}
body.theme-flame .nav-links a{color:#b8ab9d}
body.theme-flame .nav-links a:hover{background:rgba(255,255,255,.07);color:#fff}
body.theme-flame .lang-switch{background:rgba(255,255,255,.06);border-radius:3px}
body.theme-flame .lang-switch a{border-radius:2px;color:#a99d90}
body.theme-flame .lang-switch a.active,body.theme-flame .lang-switch a:hover{background:var(--orange);color:#fff!important}
body.theme-flame .site-name{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
body.theme-flame .logo{border-radius:4px}

/* ── HERO: dark with stove top ───────────────────────────────────────────── */
body.theme-flame .hero{background:#0b0908;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr;align-items:center;min-height:clamp(460px,60vw,600px);margin-bottom:0}
body.theme-flame .hero__bg--gradient{background:radial-gradient(55% 80% at 80% 60%,rgba(214,58,20,.4),transparent 62%),radial-gradient(40% 60% at 100% 100%,rgba(255,138,61,.28),transparent 62%),linear-gradient(160deg,#1a1411 0%,#0b0908 70%)}
body.theme-flame .hero__overlay{background:linear-gradient(90deg,rgba(11,9,8,.85) 0%,rgba(11,9,8,.3) 65%,transparent 100%)}
body.theme-flame .hero__content{grid-column:1;grid-row:1;align-self:center;padding:clamp(28px,6vw,64px) var(--px) 22px;max-width:640px}
body.theme-flame .hero__title{font-weight:700;line-height:1.05;font-size:clamp(2rem,5.2vw,3.4rem)}
body.theme-flame .hero__art{display:flex;position:relative;z-index:3;grid-column:1;grid-row:2;justify-content:center;padding:0 var(--px) 28px}
body.theme-flame .hero__art svg{width:min(300px,84%);height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
@media (min-width:900px){
 body.theme-flame .hero{grid-template-columns:1.05fr .95fr;padding-left:max(var(--px),calc((100vw - 1100px)/2))}
 body.theme-flame .hero__content{padding-left:0}
 body.theme-flame .hero__art{display:flex;grid-column:2;grid-row:1;justify-content:center;align-items:center}
 body.theme-flame .hero__art svg{width:min(100%,470px);height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7))}
}
body.theme-flame .fl-burn{animation:flBurn 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
body.theme-flame .fl-burn:nth-of-type(2n){animation-delay:.5s}
body.theme-flame .fl-burn:nth-of-type(3n){animation-delay:1.1s}
@keyframes flBurn{50%{opacity:.6;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){body.theme-flame .fl-burn{animation:none}}
body.theme-flame .hero__cta{background:linear-gradient(135deg,#e8461b,#c2300c);color:#fff;border-radius:3px;text-transform:uppercase;letter-spacing:.07em;font-size:.84rem;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 10px 30px rgba(214,58,20,.5)}
body.theme-flame .hero__cta:hover{box-shadow:0 14px 40px rgba(214,58,20,.7)}
body.theme-flame .hero__cta--telegram{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.3);box-shadow:none}
body.theme-flame .section-label{background:transparent;color:var(--teal);border:1px solid rgba(255,138,61,.5);border-radius:2px;letter-spacing:.2em}

/* ── CARDS: menu board ───────────────────────────────────────────────────── */
body.theme-flame .info-grid{display:grid;grid-template-columns:1fr;gap:0;column-gap:72px;margin:34px 0 0;padding:clamp(22px,4vw,44px);border:1px solid var(--border);border-radius:4px;background:linear-gradient(180deg,#1a1512,#120f0d);position:relative}
body.theme-flame .info-grid::before{content:"МЕНЮ ВЫКУПА";position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:0 18px;background:var(--surface);font-family:var(--font-head);letter-spacing:.4em;font-size:.78rem;color:var(--teal)}
@media (min-width:800px){body.theme-flame .info-grid{grid-template-columns:1fr 1fr}}
body.theme-flame .info-card{background:none;border:0;border-bottom:1px solid var(--border-soft);border-radius:0;padding:18px 0 20px;overflow:visible}
body.theme-flame .info-card::before{display:none}
body.theme-flame .info-card h3{display:flex;align-items:baseline;font-size:1.15rem;font-weight:600;margin-bottom:4px;color:var(--ink)}
body.theme-flame .info-card h3::before{display:none}
body.theme-flame .info-card h3::after{content:"";flex:1;margin:0 12px;border-bottom:2px dotted rgba(255,138,61,.55);transform:translateY(-4px)}
body.theme-flame .info-card:nth-child(1) h3::after{content:"";}
body.theme-flame .info-card p{max-width:92%}
body.theme-flame .info-card:hover{transform:none!important;box-shadow:none;border-color:var(--teal);background:rgba(255,138,61,.05)}

/* ── STEPS: heat levels ──────────────────────────────────────────────────── */
body.theme-flame .content-section:has(.process-step){display:block;overflow:visible;counter-reset:step}
body.theme-flame .content-section:has(.process-step)>.process-step{display:grid;grid-template-columns:clamp(84px,14vw,150px) 1fr;align-items:center;column-gap:20px;width:auto;padding:22px 0;border:0;border-bottom:1px solid var(--border-soft);position:relative}
body.theme-flame .process-step::before{all:unset;content:"0" counter(step);grid-row:1/span 2;font-family:var(--font-head);font-weight:700;font-size:clamp(3.2rem,8vw,5.6rem);line-height:1;color:transparent;-webkit-text-stroke:2px var(--teal);text-shadow:0 0 30px var(--teal-glow);text-align:center}
body.theme-flame .process-step::after{all:unset;content:"";grid-column:2;grid-row:3;display:block;height:6px;margin-top:12px;border-radius:0;background:linear-gradient(90deg,#ffd23d,#ff8a3d,#d63a14) 0 0/var(--heat,25%) 100% no-repeat,rgba(255,255,255,.07);box-shadow:0 0 14px rgba(255,138,61,.4)}
body.theme-flame .process-step:nth-of-type(1){--heat:25%}
body.theme-flame .process-step:nth-of-type(2){--heat:50%}
body.theme-flame .process-step:nth-of-type(3){--heat:75%}
body.theme-flame .process-step:nth-of-type(4){--heat:100%}
body.theme-flame .process-step:last-child::after{display:block}
body.theme-flame .process-step h3{grid-column:2;font-size:1.2rem;font-weight:600;margin:0}
body.theme-flame .process-step p{grid-column:2}

body.theme-flame .brands-chip{border-radius:3px;background:#1c1815;border-color:var(--border);color:var(--ink);text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;font-family:var(--font-head);font-weight:500}
body.theme-flame .brands-chip::before{background:linear-gradient(135deg,var(--orange),var(--teal))}

/* ── FAQ: two-column tiles ───────────────────────────────────────────────── */
@media (min-width:800px){body.theme-flame .faq-accordion{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
body.theme-flame .faq-accordion{counter-reset:q}
body.theme-flame .faq-acc-item{background:#1c1815;border-radius:3px;counter-increment:q;border:1px solid var(--border);border-top:3px solid var(--orange)}
body.theme-flame .faq-acc-item__q-text::before{content:counter(q,decimal-leading-zero) " ";font-family:var(--font-head);color:var(--teal);margin-right:10px}
body.theme-flame .faq-acc-item__q-text{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.03em;font-weight:500;font-size:1.02rem}
body.theme-flame .faq-acc-item.is-open{border-color:var(--teal);box-shadow:0 0 34px rgba(214,58,20,.18)}
body.theme-flame .faq-acc-item__icon{border-radius:3px;background:var(--teal-light);color:var(--teal)}
body.theme-flame .faq-acc-item.is-open .faq-acc-item__icon{background:var(--orange);color:#fff}

/* links: bar rows */
body.theme-flame .links-carousel{padding:0;margin:0}
body.theme-flame .links-nav{display:none!important}
body.theme-flame .links-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));overflow:visible;gap:10px}
body.theme-flame .links-tile{width:auto;height:78px;border-radius:3px;background:linear-gradient(90deg,#3a1408,#1a0f08);border:1px solid var(--border);border-left:4px solid var(--orange)}
body.theme-flame .links-tile__img,body.theme-flame .links-tile__monogram,body.theme-flame .links-tile__scrim{display:none}
body.theme-flame .links-tile__content{align-items:center;top:0;padding:0 18px}
body.theme-flame .links-tile__text{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.06em;font-weight:500;font-size:1.05rem}
body.theme-flame .links-tile:hover{border-color:var(--teal);box-shadow:0 0 30px rgba(214,58,20,.3)}
body.theme-flame .review-strip{background:#1c1815;border-color:var(--border);border-radius:3px}

/* ═══════════════════════════════════════════════════════════════════════════
   THEME: breeze — air conditioners.  LAYOUT CONCEPT: "airflow".
   · hero  = CENTRED: a wall-mounted A/C unit across the top, air blowing down
             onto the title; sky gradient
   · cards = airy STAGGERED clouds, alternating left/right, lots of whitespace
   · steps = TEMPERATURE scale 26° → 24° → 22° → 20° (warm to cool numerals)
   · FAQ   = borderless typographic lines, big type
   · links = a pill CLOUD (wrapping chips) instead of image tiles

body.theme-breeze {
    --ink:#0f2742; --ink-soft:#35506f; --muted:#5f7794;

    --teal:#1b78c2; --teal-dark:#0e4a80; --teal-light:#e6f3fd; --teal-glow:rgba(27,120,194,.18);
    --orange:#e8795a; --orange-dark:#cc5f40; --orange-light:#fdeee8; --orange-glow:rgba(232,121,90,.24);
    --font-head:"Raleway","Onest",Arial,sans-serif;
    --font-body:"Onest",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-family:var(--font-body); background:var(--surface);
}

      <div class="hero__content" data-animate="hero-card">
        <h1 class="hero__title">${esc(p.h1)}</h1>
        <p class="hero__sub">${esc(p.sub)}</p>
        <div class="hero__actions">
          <a href="#" class="hero__cta">${PH} Позвонить</a>
          <a href="#" class="hero__cta hero__cta--telegram">${TG} Написать в Telegram</a>
        </div>
      </div>${ART[key] || ""}</section>

    <div class="content-body">
      <section class="content-section">
        <h2>Что мы покупаем</h2>
        <p>Оцениваем по фото, приезжаем в удобное время и платим на месте. Ниже — основные категории.</p>
        <div class="info-grid">${p.cards.map(c => `<div class="info-card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')}</div>
      </section>

      <section class="content-section">
        <h2>Как проходит выкуп</h2>
        ${p.steps.map(s => `<div class="process-step"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}
      </section>

      <section class="content-section">
        <h2>Бренды, которые мы берём</h2>
        <div class="brands-list">${esc(p.brands)}</div>
      </section>
    </div>

    <section class="links-section">
      <div class="links-section__head"><div class="section-label">Разделы</div><h2 class="links-section__title">Полезные страницы</h2></div>
      <div class="links-carousel">
        <button type="button" class="links-nav links-nav--prev" aria-label="Назад"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L8.414 11l4.293 4.293a1 1 0 01-1.414 1.414l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 0z" clip-rule="evenodd"/></svg></button>
        <button type="button" class="links-nav links-nav--next" aria-label="Вперёд"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L11.586 9 7.293 4.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg></button>
        <div class="links-track" id="links-track">
          ${p.tiles.map(t => `<a href="#" class="links-tile links-tile--no-image"><span class="links-tile__monogram" aria-hidden="true">${esc(t[0])}</span><span class="links-tile__scrim"></span><span class="links-tile__content"><span class="links-tile__text">${esc(t)}</span><span class="links-tile__arrow">${ARW}</span></span></a>`).join('')}
        </div>
      </div>
    </section>

    <section class="faq-section">
      <div class="section-label">Вопросы и ответы</div>
      <h2 class="faq-section__title">Часто задаваемые вопросы</h2>
      <div class="faq-accordion">
        ${p.faq.map((f, i) => `<div class="faq-acc-item${i === 0 ? ' is-open' : ''}"><button type="button" class="faq-acc-item__q" aria-expanded="${i === 0}"><span class="faq-acc-item__q-text">${esc(f[0])}</span><span class="faq-acc-item__icon">${CHV}</span></button><div class="faq-acc-item__a"><div class="faq-acc-item__a-inner"><p>${esc(f[1])}</p></div></div></div>`).join('')}
      </div>
    </section>

    <section class="review-strip">
      <p class="review-strip__text">Если вам понравился сервис — будем рады вашему отзыву</p>
      <a class="review-strip__btn" href="#">${STAR} Оставить отзыв</a>
    </section>
  </main>

  <footer><div class="container">
    <div class="footer-content">
      <div class="footer-section"><h3>Куплю Ташкент</h3><p>Покупаем бытовую технику и мебель, новую и б/у. Быстрая оценка, честная цена, моментальная оплата.</p></div>
      <div class="footer-section"><h3>Контакты</h3><div class="contact-item"><a href="#">${PHONE}</a></div></div>
      <div class="footer-section"><h3>Информация</h3><div class="contact-item"><span>г. Ташкент</span></div><div class="contact-item"><span>Ежедневно 09:00–21:00</span></div></div>
    </div>
    <div class="copyright"><p>© 2026 Куплю Ташкент. Все права защищены.</p></div>
  </div></footer>
  <a class="floating-telegram" href="#" aria-label="Telegram">${TG}</a>`;

  // theme
  document.body.className = p.theme ? 'theme-' + p.theme : '';
  document.querySelectorAll('#pv-bar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === key));
  try { history.replaceState(null, '', '#' + key); } catch (e) {}

  // the site's reveal animations key off .is-visible
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } }), {threshold: .08});
  document.querySelectorAll('.content-section,.info-card,.process-step,.faq-section,.review-strip,.links-tile,.brands-list,.hero__content').forEach(el => io.observe(el));
  setTimeout(() => document.querySelector('.hero__content')?.classList.add('is-visible'), 120);

  // faq
  document.querySelectorAll('.faq-acc-item').forEach(item => item.querySelector('.faq-acc-item__q').addEventListener('click', () => {
    const o = item.classList.toggle('is-open'); item.querySelector('.faq-acc-item__q').setAttribute('aria-expanded', o);
  }));
  // carousel arrows
  const tr = document.getElementById('links-track');
  document.querySelector('.links-nav--prev').onclick = () => tr.scrollBy({left: -520, behavior: 'smooth'});
  document.querySelector('.links-nav--next').onclick = () => tr.scrollBy({left: 520, behavior: 'smooth'});
  // brands marquee (same logic as the site)
  document.querySelectorAll('.brands-list').forEach(list => {
    const names = list.textContent.trim().split(/\s+/); list.textContent = ''; list.classList.add('brands-list--marquee');
    const g = () => { const d = document.createElement('div'); d.className = 'brands-group'; names.forEach(n => { const s = document.createElement('span'); s.className = 'brands-chip'; s.textContent = n; d.appendChild(s); }); return d; };
    const t = document.createElement('div'); t.className = 'brands-track'; t.append(g(), g()); list.appendChild(t);
  });
  window.scrollTo(0, 0);
}
document.querySelectorAll('#pv-bar button').forEach(b => b.addEventListener('click', () => render(b.dataset.t)));
render(PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'wood');
</script>
</body>
</html>
